name: Engine tests

on:
  push:
    branches:
      - feature/engine-extraction
  pull_request:
    paths:
      - 'src/engine/**'
      - 'tests/**'
      - 'assets/game-store-DKXacG7P.js'
      - 'assets/data-skill-tree-DvCthzIY.js'
      - '.github/workflows/engine-tests.yml'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in src/engine/combat/*.mjs tests/combat/*.mjs tests/integration/*.mjs assets/game-store-DKXacG7P.js assets/data-skill-tree-DvCthzIY.js; do
            node --check "$file"
          done
      - name: Run all isolated combat tests
        run: node --test tests/combat/*.test.mjs
      - name: Check combat integration call sites
        run: |
          node tests/integration/combatBundle.test.mjs
          node tests/integration/moduleGraph.test.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve dev build and smoke-test Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/pokeloop-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tests/integration/browserSmoke.mjs
      - name: Upload Chromium failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-smoke-failure
          path: /tmp/pokeloop-browser-failure.png
          if-no-files-found: ignore
