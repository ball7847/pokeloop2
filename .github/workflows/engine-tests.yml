name: Engine tests

on:
  push:
    branches:
      - feature/engine-extraction
  pull_request:
    paths:
      - 'src/engine/**'
      - 'tests/**'
      - 'assets/game-store-DKXacG7P.js'
      - 'assets/data-skill-tree-DvCthzIY.js'
      - '.github/workflows/engine-tests.yml'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in src/engine/combat/*.mjs tests/combat/*.mjs assets/game-store-DKXacG7P.js; do
            node --check "$file"
          done
      - name: Run all isolated combat tests
        run: node --test tests/combat/*.test.mjs
      - name: Check combat integration call sites
        run: node tests/integration/combatBundle.test.mjs
